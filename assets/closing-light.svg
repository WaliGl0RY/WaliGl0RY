<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="closing-title closing-desc">
  <title id="closing-title">Thanks for reading. Let's talk.</title>
  <desc id="closing-desc">The blue line from the banner runs along the bottom of the card and ends in a dot right after the last word. A dotted line runs on from the dot to the edge.</desc>

  <!-- Light variant: closing card, accent #2563EB. bg #FAFAFA, text #09090B, line #D4D4D8.
       Static: no scripts, no fonts or files loaded from anywhere. -->
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="328" rx="24"/></clipPath>
    <radialGradient id="wash" gradientUnits="userSpaceOnUse" cx="469" cy="218" r="560">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="469" cy="218" r="52">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1278" height="328" rx="24" fill="#FAFAFA"/>

  <g clip-path="url(#card)">
    <rect width="1280" height="330" fill="url(#wash)"/>
    <!-- the road: travelled up to the dot, dotted from there on -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -20 286 H 413 A 56 56 0 0 0 469 230 V 218 H 1300" stroke="#09090B" stroke-opacity=".04" stroke-width="30"/>
      <path d="M 469 218 H 1300" stroke="#09090B" stroke-opacity=".5" stroke-width="3" stroke-dasharray="1 13"/>
      <path d="M -20 286 H 413 A 56 56 0 0 0 469 230 V 218" stroke="#2563EB" stroke-width="4"/>
    </g>
    <circle cx="469" cy="218" r="52" fill="url(#glow)"/>
    <circle cx="469" cy="218" r="10" fill="#2563EB" stroke="#FAFAFA" stroke-width="4"/>
  </g>

  <rect x="1" y="1" width="1278" height="328" rx="24" fill="none" stroke="#D4D4D8" stroke-width="2"/>

  <text x="80" y="128" fill="#09090B" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2.8">Thanks for reading.</text>
  <text x="80" y="228" fill="#09090B" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2.8" textLength="366" lengthAdjust="spacing">Let's talk</text>
</svg>
