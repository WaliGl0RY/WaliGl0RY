<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">WayIn</title>
  <desc id="cover-desc">Project card: the name WayIn and three linked steps in the project's colour.</desc>

  <!-- Dark variant: project card for WayIn, project colour #A78BFA. bg #09090B, text #FAFAFA, line #27272A.
       Static: no scripts, no fonts or files loaded from anywhere. -->
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="218" rx="24"/></clipPath>
    <radialGradient id="wash" gradientUnits="userSpaceOnUse" cx="1060" cy="110" r="520">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".14"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1180" cy="110" r="52">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1278" height="218" rx="24" fill="#09090B"/>

  <g clip-path="url(#card)">
    <rect width="1280" height="220" fill="url(#wash)"/>
    <path d="M 884 110 H 1180" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1180" cy="110" r="52" fill="url(#glow)"/>
    <circle cx="900" cy="110" r="16" fill="#09090B" stroke="#A78BFA" stroke-width="5"/>
    <circle cx="1040" cy="110" r="16" fill="#09090B" stroke="#A78BFA" stroke-width="5"/>
    <circle cx="1180" cy="110" r="16" fill="#A78BFA" stroke="#09090B" stroke-width="4"/>
  </g>

  <rect x="1" y="1" width="1278" height="218" rx="24" fill="none" stroke="#27272A" stroke-width="2"/>
  <rect x="0" y="48" width="7" height="124" rx="3.5" fill="#A78BFA"/>

  <text x="80" y="145" fill="#FAFAFA" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="700" letter-spacing="-3">Way<tspan fill="#A78BFA">I</tspan>n</text>
</svg>
